# extra settings to be merged into OpenTelemetry Collector configuration
# do not delete this file

# TigerLite OTLP/HTTP exporter.
# Endpoint and bearer token come from env vars wired in docker-compose.yml.
# When TIGERLITE_OTLP_ENDPOINT is unreachable the collector logs an error and
# keeps running; the bundled Jaeger / Prometheus / OpenSearch exporters are
# unaffected.
exporters:
  otlphttp/tigerlite:
    endpoint: ${env:TIGERLITE_OTLP_ENDPOINT}
    headers:
      Authorization: "Bearer ${env:TIGERLITE_INGEST_TOKEN}"
    sending_queue:
      batch:

service:
  pipelines:
    traces:
      exporters: [otlp_grpc/jaeger, debug, spanmetrics, otlphttp/tigerlite]
    metrics:
      exporters: [otlp_http/prometheus, debug, otlphttp/tigerlite]
    logs:
      exporters: [opensearch, debug, otlphttp/tigerlite]
