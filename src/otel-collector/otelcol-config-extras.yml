# extra settings to be merged into OpenTelemetry Collector configuration
# do not delete this file

# TigerLite OTLP/HTTP exporter.
# Endpoint and bearer token come from env vars wired in docker-compose.yml.
# When TIGERLITE_OTLP_ENDPOINT is unreachable the collector logs an error and
# keeps running; the bundled Jaeger / Prometheus / OpenSearch exporters are
# unaffected.
exporters:
  otlphttp/tigerlite:
    endpoint: ${env:TIGERLITE_OTLP_ENDPOINT:-http://host.docker.internal:8080}
    headers:
      Authorization: "Bearer ${env:TIGERLITE_INGEST_TOKEN:-tigerlite-placeholder-token}"
    sending_queue:
      batch:

# TigerLite currently only ingests traces (its dashboard's connect modal
# advertises only http://localhost:8080/v1/traces). The /v1/metrics and
# /v1/logs endpoints respond 400 InvalidArgument to real OTLP payloads —
# treat them as unimplemented and only wire tigerlite into the traces
# pipeline. Metrics and logs continue flowing to the bundled Prometheus
# and OpenSearch exporters for local cross-checking. Re-add
# `otlphttp/tigerlite` to the metrics/logs pipelines below once TigerLite
# implements those signals.
service:
  pipelines:
    traces:
      exporters: [otlp_grpc/jaeger, debug, spanmetrics, otlphttp/tigerlite]
